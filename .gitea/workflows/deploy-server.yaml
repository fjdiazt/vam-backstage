name: Deploy VaM Backstage

on:
  push:
    branches: ['develop']

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Connecting to Gitea
        run: git config --global url."http://oboro.local:6080/".insteadOf "http://gitea:3000/"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via Docker Compose
        run: |
          cat > .env << 'EOF'
          VAM_ROOT_MOUNT=${{ vars.VAM_ROOT_MOUNT || '/mnt/vam-root' }}
          VAM_STORAGE_MOUNT=${{ vars.VAM_STORAGE_MOUNT || '/mnt/vam-storage' }}
          VAM_STORAGE_TARGET=${{ vars.VAM_STORAGE_TARGET || '/??/D:/games/vam' }}
          EOF
          docker compose up -d --build
          sleep 5
          docker compose ps
          container_id=$(docker compose ps -q backstage)
          test -n "$container_id"
          test "$(docker inspect --format '{{.State.Status}}' "$container_id")" = running
          test "$(docker inspect --format '{{.RestartCount}}' "$container_id")" = 0
          docker compose exec -T backstage sh -eu -c '
            for path in /vam/AddonPackages /vam/AddonPackagesOffloaded; do
              test -d "$path"
              test -n "$(find "$path/" -mindepth 1 -maxdepth 1 -print -quit)"
            done
            ELECTRON_RUN_AS_NODE=1 /opt/vam-backstage/vam-backstage -e "
              const fs = require(\"node:fs\")
              const source = \"/vam/AddonPackages/.vam-backstage-fs-probe\"
              const target = \"/vam/AddonPackagesOffloaded/.vam-backstage-fs-probe\"
              try {
                fs.writeFileSync(source, \"probe\")
                fs.renameSync(source, target)
                fs.unlinkSync(target)
              } finally {
                for (const path of [source, target]) {
                  try {
                    fs.unlinkSync(path)
                  } catch (error) {
                    if (error.code !== \"ENOENT\") throw error
                  }
                }
              }
            "
          '
          for attempt in $(seq 1 20); do
            docker compose exec -T backstage curl --fail --silent --output /dev/null http://127.0.0.1:42069/ && exit 0
            sleep 1
          done
          docker compose logs --tail=100 backstage
          exit 1
